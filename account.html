<!doctype html><html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TunnelGuard | Account & password</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#183953,#0b1220 65%);color:#e9f2fb;font:15px Tahoma,system-ui;min-height:100vh}main{max-width:670px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:32px}a{color:#7dd3fc;text-decoration:none}button{font:inherit;cursor:pointer;padding:12px 18px;border:1px solid #37516e;border-radius:10px;background:#1b3047;color:#eef}section{padding:30px;background:#111e30;border:1px solid #304b67;border-radius:20px;box-shadow:0 15px 45px #0003}h1{font-size:26px;margin:0 0 14px}p{color:#a9bfd2;line-height:1.9}label{display:block;margin:18px 0 8px}input{font:inherit;width:100%;background:#0b1728;color:#fff;padding:13px;border:1px solid #37516e;border-radius:9px}input:focus-visible,button:focus-visible{outline:2px solid #7dd3fc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}button[type=submit]{background:#7fe4c4;color:#09231d;font-weight:bold}button:disabled{opacity:.5;cursor:wait}#feedback{min-height:32px;overflow-wrap:anywhere}.brand{font-weight:bold;font-size:20px;direction:ltr}.foot{font-size:12px;text-align:center}@media(max-width:550px){.grid{grid-template-columns:1fr;gap:0}section{padding:22px}header{flex-wrap:wrap}}
</style><main><header><a href="/" class="brand">◈ TunnelGuard v2.6.1</a><a href="/" data-en="Back to dashboard"></a></header><section><h1 data-en="Account & password"></h1><p data-en="Change your panel username or password. Saving ends existing sessions and requires signing in again."></p><form id="account"><div class="grid"><div><label for="current-user" data-en="Current username"></label><input id="current-user" autocomplete="username" required maxlength="64"></div><div><label for="current-pass" data-en="Current password"></label><input id="current-pass" type="password" autocomplete="current-password" required maxlength="256"></div></div><label for="new-user" data-en="New username"></label><input id="new-user" required pattern="[A-Za-z0-9_.-]{1,64}" maxlength="64" autocomplete="off"><p data-en="Letters, numbers, dots, hyphens or underscores; up to 64 characters."></p><div class="grid"><div><label for="new-pass" data-en="New password (12+ characters)"></label><input id="new-pass" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div><div><label for="repeat-pass" data-en="Repeat password"></label><input id="repeat-pass" type="password" autocomplete="new-password" required></div></div><div class="actions"><button id="save" type="submit" data-en="🔐 Save credentials"></button><button id="logout" type="button" data-en="Sign out"></button></div><p id="feedback" role="status" aria-live="polite"></p></form></section><p class="foot" data-en="TunnelGuard account settings"></p></main>
<script>
const token=/*TOKEN*/null,$=id=>document.getElementById(id);const lang='en';
function translate(){document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset.en)}
function message(en){$('feedback').textContent=en}
translate();
$('logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST'});location.replace('/login')}catch{message('Connection failed.')}};
async function waitForApply(){for(let i=0;i<45;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch('/api/tunnels',{signal:AbortSignal.timeout(3000)});if(r.status===401){location.replace('/login');return}if(!r.ok)continue;const s=await r.json();if(s.forward_result==='failed'){message('Apply failed; retain your previous credentials.');$('save').disabled=false;return}if(s.forward_result==='applied'){location.replace('/login');return}}catch{}}message('No confirmation received; check the login page and service status.');$('save').disabled=false}
$('account').onsubmit=async e=>{e.preventDefault();if($('new-pass').value!==$('repeat-pass').value){message('Passwords do not match.');return}$('save').disabled=true;message('Saving…');try{const r=await fetch('/api/tunnels',{method:'POST',headers:{'Content-Type':'application/json','X-TunnelGuard-Token':token},body:JSON.stringify({op:'credentials',data:{current_username:$('current-user').value,current_password:$('current-pass').value,username:$('new-user').value,password:$('new-pass').value}}),signal:AbortSignal.timeout(25000)});if(r.status===401){location.replace('/login');return}const result=await r.json();if(!r.ok||result.error)throw Error(result.error||'Request failed');$('current-pass').value=$('new-pass').value=$('repeat-pass').value='';message('Applying; you will return to sign in.');await waitForApply()}catch(error){$('feedback').textContent=error.message;$('save').disabled=false}};
</script></html>

name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: 'Isolated soak duration (60..7200 seconds)'
        default: '300'
        required: true
permissions:
  contents: read
jobs:
  spoof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download pinned integration assets
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/sing-box.tar.gz" https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-${{ matrix.arch }}.tar.gz
          curl --fail --location --output "$RUNNER_TEMP/spoof" https://github.com/ParsaKSH/spoof-tunnel/releases/download/v3.1.0-beta.0/spoof-linux-${{ matrix.arch }}
      - name: Isolated raw transport and paired service integration
        timeout-minutes: 140
        env:
          SOAK_INPUT: ${{ inputs.soak_seconds || '60' }}
        run: |
          python3 -c 'import os; n=int(os.environ["SOAK_INPUT"]); assert 60 <= n <= 7200'
          sudo env GITHUB_ACTIONS=true TG_SOAK_SECONDS="$SOAK_INPUT" /usr/bin/python3 spoof_integration.py "$RUNNER_TEMP/sing-box.tar.gz" "$RUNNER_TEMP/spoof"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -v
      - name: Validate example configuration
        run: python tunnelguard.py check --lang en --config config.multilayer.example.json
      - name: Real core transport and fallback integration (Linux)
        if: runner.os == 'Linux'
        env:
          TG_CORE_TEST: '1'
        run: python -m unittest test_deploy.RealCoreTests -v
      - name: Installer smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python install.py --prefix "$RUNNER_TEMP/tg install" --bin-dir "$RUNNER_TEMP/tg bin"
          "$RUNNER_TEMP/tg bin/tunnelguard" --version
          printf '{"preserve":true}\n' > "$RUNNER_TEMP/tg install/config.json"
          python install.py --prefix "$RUNNER_TEMP/tg install" --bin-dir "$RUNNER_TEMP/tg bin"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"tg install/config.json"; assert json.loads(p.read_text())=={"preserve":True}'
      - name: Install both systemd nodes (Ubuntu)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        shell: bash
        run: |
          cleanup() {
            sudo journalctl -u tunnelguard-server-server -u tunnelguard-client-shadowsocks -u tunnelguard-client-trojan -u tunnelguard-client-hysteria2 -u tunnelguard-client-guard --no-pager -n 80 || true
            sudo systemctl disable --now tunnelguard-server-server tunnelguard-client-shadowsocks tunnelguard-client-trojan tunnelguard-client-hysteria2 tunnelguard-client-guard || true
            if [ -n "${fixture_pid:-}" ]; then kill "$fixture_pid" || true; fi
          }
          trap cleanup EXIT
          sudo /usr/bin/python3 deploy.py server --address 127.0.0.1 --ports 29443 29444 29445 --output "$RUNNER_TEMP/deployment-server" --apply
          sudo /usr/bin/python3 deploy.py client --bundle "$RUNNER_TEMP/deployment-server/pairing.json" --output "$RUNNER_TEMP/deployment-client" --apply
          sudo systemctl is-active tunnelguard-server-server tunnelguard-client-shadowsocks tunnelguard-client-trojan tunnelguard-client-hysteria2 tunnelguard-client-guard
          mkdir "$RUNNER_TEMP/http-fixture"
          printf 'systemd-transport-ok' > "$RUNNER_TEMP/http-fixture/payload"
          python -m http.server 28880 --bind 127.0.0.1 --directory "$RUNNER_TEMP/http-fixture" >/dev/null 2>&1 &
          fixture_pid=$!
          for port in 11001 11002 11003; do
            result=$(curl -q --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --max-time 5 --noproxy '' --proxy "socks5h://127.0.0.1:$port" http://127.0.0.1:28880/payload)
            test "$result" = 'systemd-transport-ok'
          done
